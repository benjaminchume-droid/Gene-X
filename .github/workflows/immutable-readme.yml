name: Immutable README

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  protect-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject README changes
        shell: bash
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          if git diff --name-only "origin/${{ github.event.pull_request.base.ref }}"...HEAD | grep -Fxq "README.md"; then
            echo "README.md is immutable and must not be changed."
            exit 1
          fi

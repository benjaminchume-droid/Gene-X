name: Gene X Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: brain-core
            path: tests/test_brain.py tests/test_domain_neutrality.py
            filter: ""
          - name: learning
            path: tests/learning tests/unit/test_training_primitives.py
            filter: ""
          - name: runtime
            path: tests/runtime tests/test_persistence.py tests/test_runtime_organism.py tests/test_durable_autonomy.py
            filter: ""
          - name: integration
            path: tests/integration tests/end-to-end tests/cognition
            filter: ""
          - name: security-tools
            path: tests/security tests/tools
            filter: ""
          - name: red-production
            path: tests/test_red_production.py tests/test_red_learning_substrate.py
            filter: ""
          - name: training-data
            path: tests/test_training_dataset.py tests/test_training_pipeline.py
            filter: ""
          - name: multimodal-generation
            path: tests/test_multimodal_and_generation.py
            filter: ""
          - name: capabilities
            path: tests/test_capabilities.py
            filter: ""
          - name: compile
            path: ""
            filter: ""
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run tests
        if: ${{ matrix.name != 'compile' }}
        run: python -m pytest -q ${{ matrix.path }}
      - name: Compile package
        run: python -m compileall -q gene trainers benchmarks data configs interfaces

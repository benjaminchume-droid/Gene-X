name: Gene X Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: core
            path: "tests/test_brain.py tests/test_core_integration.py tests/test_training.py tests/test_substrate_and_language.py"
          - name: learning
            path: "tests/learning tests/unit/test_training_primitives.py tests/test_red_learning_substrate.py"
          - name: runtime
            path: "tests/runtime tests/test_persistence.py tests/test_runtime_organism.py tests/test_durable_autonomy.py"
          - name: integration
            path: "tests/integration tests/end-to-end tests/cognition"
          - name: security-tools
            path: "tests/security tests/tools"
          - name: capabilities-domain
            path: "tests/test_capabilities.py tests/test_domain_neutrality.py"
    runs-on: ubuntu-latest
    name: ${{ matrix.group.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run ${{ matrix.group.name }} tests
        shell: bash
        run: |
          python -m pytest -q ${{ matrix.group.path }}
      - name: Compile package
        run: python -m compileall -q gene trainers benchmarks data configs interfaces

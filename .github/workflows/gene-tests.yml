name: Gene X Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: brain-learns
            path: tests/test_brain.py
            filter: test_structured_brain_learns_without_token_sequences
          - name: brain-representation
            path: tests/test_brain.py
            filter: test_representation_is_trainable_without_labels
          - name: brain-long-task
            path: tests/test_brain.py
            filter: test_long_task_survives_plan_changes
          - name: brain-cycle
            path: tests/test_brain.py
            filter: test_cycle_observes_acts_verifies_and_learns
          - name: brain-neutral
            path: tests/test_brain.py
            filter: test_domain_neutral_primitives
          - name: red-predictive
            path: tests/test_red_learning_substrate.py
            filter: test_predictive_core
          - name: red-alignment
            path: tests/test_red_learning_substrate.py
            filter: test_cross_modal_alignment
          - name: domain-neutrality
            path: tests/test_domain_neutrality.py
            filter: ""
          - name: core
            path: "tests/test_core_integration.py tests/test_training.py tests/test_substrate_and_language.py"
            filter: ""
          - name: learning
            path: "tests/learning tests/unit/test_training_primitives.py"
            filter: ""
          - name: runtime
            path: "tests/runtime tests/test_persistence.py tests/test_runtime_organism.py tests/test_durable_autonomy.py"
            filter: ""
          - name: integration
            path: "tests/integration tests/end-to-end tests/cognition"
            filter: ""
          - name: security-tools
            path: "tests/security tests/tools"
            filter: ""
          - name: capabilities
            path: tests/test_capabilities.py
            filter: ""
          - name: red-production
            path: "tests/test_red_production.py tests/test_training_dataset.py"
            filter: ""
          - name: compile
            path: ""
            filter: ""
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run tests
        if: ${{ matrix.name != 'compile' }}
        shell: bash
        run: |
          python -m pytest -q ${{ matrix.path }} ${{ matrix.filter && format('-k "{0}"', matrix.filter) || '' }}
      - name: Compile package
        run: python -m compileall -q gene trainers benchmarks data configs interfaces
